<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Security System - Laser & LDR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 1.5em;
            color: #1e3c72;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 30px;
            height: 30px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .status-light {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .status-light.active {
            background: #4CAF50;
            box-shadow: 0 0 30px #4CAF50;
            animation: pulse 2s infinite;
        }

        .status-light.inactive {
            background: #f44336;
            box-shadow: 0 0 30px #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status-text {
            font-size: 1.3em;
            font-weight: bold;
        }

        .status-text.active {
            color: #4CAF50;
        }

        .status-text.inactive {
            color: #f44336;
        }

        .control-button {
            width: 100%;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-button.on {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .control-button.on:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.6);
        }

        .control-button.off {
            background: linear-gradient(135deg, #f44336, #da190b);
            color: white;
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        .control-button.off:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.6);
        }

        .counter-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .counter-number {
            font-size: 4em;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .counter-label {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .laser-visualization {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            min-height: 200px;
        }

        .laser-beam {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ff0000, transparent);
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .laser-beam.active {
            opacity: 1;
            animation: laser-scan 2s ease-in-out infinite;
        }

        @keyframes laser-scan {
            0%, 100% { transform: translateY(-50%) scaleX(1); }
            50% { transform: translateY(-50%) scaleX(0.95); }
        }

        .sensor-points {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
        }

        .sensor {
            width: 20px;
            height: 80px;
            background: #333;
            border-radius: 5px;
            position: relative;
        }

        .sensor::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sensor.active::after {
            opacity: 1;
            box-shadow: 0 0 10px #ff0000;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .log-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 10px;
            border-left: 4px solid #667eea;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-time {
            color: #666;
            font-size: 0.9em;
        }

        .reset-button {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .reset-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .calibrate-button {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            margin-top: 15px;
            margin-left: 10px;
            transition: all 0.3s ease;
        }

        .calibrate-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏦 SISTEM KEAMANAN BANK</h1>
            <p>Laser Security & LDR Sensor Monitoring System</p>
        </div>

        <div class="main-grid">
            <div class="card">
                <div class="card-title">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 2L2 7v10c0 5.5 3.8 9.7 10 11 6.2-1.3 10-5.5 10-11V7L12 2z" stroke-width="2"/>
                    </svg>
                    Kontrol Sistem
                </div>
                
                <div class="status-indicator">
                    <div id="statusLight" class="status-light inactive"></div>
                    <div id="statusText" class="status-text inactive">SISTEM MATI</div>
                </div>

                <button id="toggleButton" class="control-button on" onclick="toggleSystem()">
                    AKTIFKAN SISTEM
                </button>

                <div class="button-group">
                    <button class="calibrate-button" onclick="calibrateSensor()">
                        🔧 Kalibrasi Sensor
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke-width="2"/>
                    </svg>
                    Deteksi Pengunjung
                </div>
                
                <div class="counter-display">
                    <div class="counter-label">TOTAL TERDETEKSI</div>
                    <div id="counterDisplay" class="counter-number">0</div>
                    <div class="counter-label">Orang Melewati Laser</div>
                </div>

                <button class="reset-button" onclick="resetCounter()">🔄 Reset Counter</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-width="2"/>
                </svg>
                Visualisasi Laser & Sensor LDR
            </div>
            
            <div class="laser-visualization">
                <div class="sensor-points">
                    <div id="sensor1" class="sensor"></div>
                    <div id="sensor2" class="sensor"></div>
                </div>
                <div id="laserBeam" class="laser-beam"></div>
            </div>
        </div>

        <div class="card log-section">
            <div class="card-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-width="2"/>
                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke-width="2"/>
                </svg>
                Log Aktivitas
            </div>
            <div id="logContainer"></div>
        </div>
    </div>

    <script>
        let systemActive = false;
        let counter = 0;
        let updateInterval;

        // Fungsi untuk update status dari ESP32
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                // Update system status
                systemActive = data.system_active;
                updateUI(systemActive);
                
                // Update counter
                if (data.intrusion_count !== counter) {
                    counter = data.intrusion_count;
                    document.getElementById('counterDisplay').textContent = counter;
                    
                    if (counter > 0 && systemActive) {
                        addLog('🚨 DETEKSI! Seseorang melewati laser (#' + counter + ')');
                        
                        // Flash effect
                        const counterDisplay = document.getElementById('counterDisplay');
                        counterDisplay.style.transform = 'scale(1.2)';
                        setTimeout(() => {
                            counterDisplay.style.transform = 'scale(1)';
                        }, 200);
                    }
                }
                
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        // Fungsi untuk toggle system
        async function toggleSystem() {
            try {
                const response = await fetch('/api/toggle', { method: 'POST' });
                const data = await response.json();
                systemActive = data.system_active;
                updateUI(systemActive);
                
                addLog(systemActive ? '✅ Sistem keamanan laser diaktifkan' : '⛔ Sistem keamanan laser dinonaktifkan');
            } catch (error) {
                console.error('Error toggling system:', error);
            }
        }

        // Fungsi untuk reset counter
        async function resetCounter() {
            try {
                const response = await fetch('/api/reset', { method: 'POST' });
                const data = await response.json();
                counter = data.intrusion_count;
                document.getElementById('counterDisplay').textContent = counter;
                addLog('🔄 Counter direset ke 0');
            } catch (error) {
                console.error('Error resetting counter:', error);
            }
        }

        // Fungsi untuk kalibrasi sensor
        async function calibrateSensor() {
            try {
                addLog('🔧 Memulai kalibrasi sensor...');
                const response = await fetch('/api/calibrate', { method: 'POST' });
                addLog('✅ Kalibrasi sensor selesai');
            } catch (error) {
                console.error('Error calibrating sensor:', error);
                addLog('❌ Gagal melakukan kalibrasi sensor');
            }
        }

        // Update UI berdasarkan status
        function updateUI(isActive) {
            const statusLight = document.getElementById('statusLight');
            const statusText = document.getElementById('statusText');
            const toggleButton = document.getElementById('toggleButton');
            const laserBeam = document.getElementById('laserBeam');
            const sensor1 = document.getElementById('sensor1');
            const sensor2 = document.getElementById('sensor2');

            if (isActive) {
                statusLight.className = 'status-light active';
                statusText.className = 'status-text active';
                statusText.textContent = 'SISTEM AKTIF';
                toggleButton.className = 'control-button off';
                toggleButton.textContent = 'MATIKAN SISTEM';
                laserBeam.classList.add('active');
                sensor1.classList.add('active');
                sensor2.classList.add('active');
            } else {
                statusLight.className = 'status-light inactive';
                statusText.className = 'status-text inactive';
                statusText.textContent = 'SISTEM MATI';
                toggleButton.className = 'control-button on';
                toggleButton.textContent = 'AKTIFKAN SISTEM';
                laserBeam.classList.remove('active');
                sensor1.classList.remove('active');
                sensor2.classList.remove('active');
            }
        }

        // Fungsi untuk menambah log
        function addLog(message) {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID');
            
            logEntry.innerHTML = `
                <div class="log-time">${timeString}</div>
                <div>${message}</div>
            `;
            
            logContainer.insertBefore(logEntry, logContainer.firstChild);
            
            // Keep only last 10 logs
            while (logContainer.children.length > 10) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        // Inisialisasi
        document.addEventListener('DOMContentLoaded', function() {
            // Mulai update status secara berkala
            updateInterval = setInterval(updateStatus, 1000);
            
            // Initial log
            addLog('💼 Sistem siap digunakan');
            addLog('📡 Terhubung ke ESP32');
        });
    </script>
</body>
</html>
